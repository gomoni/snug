name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Writing `types:` at all REPLACES the default set, so the three defaults
    # are spelled out beside the one being added. `ready_for_review` is the
    # addition: the jobs below do not run while a pull request is a draft, so
    # taking it out of draft is what has to start the real suite. Without this
    # line a draft opened, pushed to, and then marked ready would carry the
    # skipped checks from its draft life into a mergeable state.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# One run per pull request. A push that supersedes an in-flight run cancels it
# rather than racing it: the older run grades code nobody will merge, and the
# integration jobs are the slowest thing here.
#
# Scoped to pull requests on purpose — `cancel-in-progress` is false for a push
# to main, where every commit's result is a record and a cancelled run would
# leave a gap in it. The group key is the PR number where there is one, so two
# pushes to the same PR share a group and a push to main never joins one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to a COMMIT SHA, never to a tag, and the tag is
# written beside it as a comment so a human can read what the SHA is meant to be.
#
# A tag is a mutable pointer in somebody else's repository. `@v5` re-resolves on
# every run, so the code that executes in this job — with the checkout, the Go
# toolchain and the repository token in reach — is whatever that pointer names
# today. That is the supply-chain shape snug refuses everywhere else: no silent
# change to what runs. A SHA cannot be repointed, so an upgrade becomes a diff a
# reviewer sees, which is the same argument as the golden argv files.
#
# The comment is NOT the pin and does not have to be believed. Verify one with:
#
#   gh api repos/actions/checkout/git/ref/tags/v7.0.1 -q .object.sha
#
# Upgrading means re-running that command and replacing both halves together. A
# SHA whose comment has drifted from it is worse than no comment.
#
# Every job below carries `if: github.event.pull_request.draft != true`, which
# is the whole of the draft support. Three things about that line:
#
#   - It is a JOB condition, not `paths-ignore` or a second workflow. A job
#     skipped by `if:` still posts its check run, with conclusion `skipped`,
#     and the branch ruleset counts that as satisfied. A workflow filtered out
#     of running never posts the check at all, and a pull request requiring it
#     sits at "Expected — waiting for status" with no way forward.
#   - Skipping is safe HERE only because a draft cannot be merged. The checks
#     go green-by-absence, and the ruleset would accept them; what stops an
#     untested merge is GitHub refusing to merge a draft at all. Do not copy
#     this shape to skip jobs on a condition that leaves the pull request
#     mergeable — that is a bypass, not an optimisation.
#   - `github.event.pull_request` is null on a push to main, and `null != true`
#     is true, so pushes to main run everything. The comparison is against
#     `true` rather than a truthiness test for exactly that reason.
#
# The convention this buys: open a pull request as a DRAFT while it is still
# being written or while sandbox-policy and redteam are still looking at it,
# and mark it Ready for review when it is meant to be graded. Ready is the
# signal that runs the suite. The cost is real and worth stating — a draft gets
# no CI signal at all, so a break introduced in the middle of a long draft
# branch surfaces all at once when it is marked ready.
jobs:
  # Tier 1 and 2: the resolver's algebraic invariants and the golden argv files.
  # These need no privileges and no namespaces — that is the payoff for keeping
  # internal/policy pure with an injected Environ, and it is why the
  # security-critical checks run on any runner.
  gate:
    name: gofmt, vet, unit tests
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, tags or calls the API, so the
          # token has no reason to outlive the checkout step. Left at the
          # default it is written into .git/config and every later step —
          # including `make gate`, which runs this repository's own code — can
          # read it. Deny by default, the same way a profile is a named hole.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
      - run: make gate

  # Tier 1b: the fork child does not wedge (issue #221). Its own job, in
  # parallel, for one reason — it costs seconds and the gate should stay quick —
  # and on a plain runner, because it needs no privileges at all: it raw-forks
  # and reads /proc, it does not create a namespace.
  #
  # Kept BLOCKING rather than advisory. The property it proves is that
  # `snug attach` returns at all under load, and the only thing that can prove
  # it is this test failing when it stops being true. Note it carries its own
  # positive control: if the runner never provokes a preempt request, the test
  # FAILS saying the harness needs repair, rather than passing vacuously.
  forkstress:
    name: the fork child does not wedge
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
      - run: make forkstress

  # Tier 3: really launch sandboxes and assert what is and is not reachable.
  #
  # The assertions live in Go, under the `integration` build tag, in
  # test/integration/ — see .claude/design/INDEX.md §12.3–12.4. They were briefly written
  # as shell in this file and that was a mistake: a backgrounded
  # `python3 -m http.server` held the step's stdout open, the runner waited on
  # that pipe rather than on the commands, and it cancelled the job after eleven
  # minutes with every assertion already passed. In Go the listener is a
  # net.Listener owned by the test and closed by t.Cleanup.
  #
  # Moving it to Go did not by itself make the pipe problem go away, and the
  # earlier version of this comment said it had. os/exec gives every sandbox a
  # pipe for its output and Wait does not return until the last write end closes,
  # so the same hang was reachable one level down — the harness now sets
  # Cmd.WaitDelay on every invocation to bound it. See test/integration.
  #
  # So what stays in this file is only what genuinely belongs to CI: installing
  # the host packages, the sysctl, and the timeout.
  #
  # On bounding the runtime — there are now three nested bounds, and this file
  # owns only the outermost:
  #
  #   1. budget() in the Go suite: per-test, seconds. Fails naming the test.
  #   2. `go test -timeout 4m` in the Makefile: whole package.
  #   3. timeout-minutes here: the job, including apt and setup-go.
  #
  # Only (1) can say WHICH test was slow, which is why the numbers below are
  # deliberately not generous: if (2) or (3) ever fires, the interesting fact is
  # that (1) did not.
  # Tier 3a: the tests that need neither bwrap nor pasta.
  #
  # This job installs NOTHING and finishes in seconds, so a broken dry-run
  # screen or a refusal that stopped refusing is reported without waiting for
  # the sandbox jobs. It is not a subset anyone maintains: the suite already
  # gates every sandbox test on requireSandbox/requirePasta/requireEngine, so on
  # a runner with neither binary those skip and what remains runs. Membership is
  # decided by the runner, and a test that stops needing bwrap joins this job by
  # itself.
  #
  # SNUG_REQUIRE_SANDBOX is deliberately NOT set here — it turns every skip into
  # a failure, which is right for the jobs below and wrong for this one. What
  # stops the job going green having run nothing is the floor in
  # `make integration-hostless`, which fails if fewer tests ran than the number
  # of tests that need no sandbox today.
  hostless:
    name: dry-run and refusal behaviour
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
      - run: make build
      - run: make integration-hostless

  # Tier 3b and 3c: really launch sandboxes and assert what is and is not
  # reachable.
  #
  # ONE job did all of this until 2026-08-21, and it was the long pole at 147s.
  # Measured on run 32471090448: the test binary was 106s of that, and THREE
  # tests were 68s of the 106s — the kill-during-startup family, which is slow
  # for a good reason (each signals a real sandbox at a real moment and repeats
  # to make the race appear, so the seconds are the measurement). Splitting them
  # into a sibling job that runs in parallel makes the longest job ~70s instead
  # of ~147s and changes nothing about what is asserted.
  #
  # A matrix rather than two copied jobs, because everything above `make` —
  # the apt rewrite, the bounded update, the pasta install and its version
  # check, the sysctl — is identical and a second copy would drift.
  integration:
    name: ${{ matrix.label }}
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    strategy:
      # Both halves always run: a failure in one must not hide the other's
      # result, which is what fail-fast would do.
      fail-fast: false
      matrix:
        include:
          - suite: integration-sandbox
            label: real sandbox behaviour
          - suite: integration-signals
            label: sandbox startup signal races
    # apt and setup-go dominate the fixed cost; the variable half is still at
    # most ~70s HERE, because this runner has no container engine (#395) and
    # the engine tier skips.
    #
    # 8 -> 12 by issue #401, and NOT because CI got slower. The Makefile's
    # integration-sandbox bound went 4m -> 8m (the pin un-skips the engine
    # tier; measured 335.98s on a host with a real podman), and the three
    # bounds must keep nesting: budget() per test, -timeout per suite,
    # timeout-minutes per job. An inner bound equal to the outer can never
    # fire, and then a slow suite reads as a bare job kill naming nothing —
    # losing the only thing these bounds are for.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # See the gate job: this one has more reason still, since it launches
          # real sandboxes running real payloads.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      # `apt-get update` with no timeouts hung this job twice in a row: both
      # runs sat fetching from azure.archive.ubuntu.com until the 8-minute job
      # budget ran out, without a single test having started, and a re-run
      # landed on a runner behaving the same way. A mirror that is not
      # answering must cost seconds and say so, not eat the whole job — so the
      # regional mirror is dropped for the canonical one, and the fetch is
      # given bounded retries and a per-connection timeout.
      #
      # This is a RUNNER fix, not a test fix: nothing here changes what the
      # suite asserts. If this step ever fails, read it as "the Ubuntu mirror
      # is down", not as a sandbox regression.
      - name: Install bubblewrap
        run: |
          # Rewrite EVERY regional Ubuntu mirror to the canonical one, in both
          # sources formats the runner images use (one-line `deb ` and deb822
          # `URIs:`). The previous version of this only rewrote
          # azure.archive.ubuntu.com and only over its own scheme, and the
          # azure entries survived — visible in the job log as `Ign:` lines
          # against a host the fix claimed to have removed. A rewrite that
          # silently matches nothing is the same shape as a guard that is never
          # read.
          sudo sed -i -E 's#https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true

          # BOUNDED, and this is the part that matters. `apt-get update` with
          # Acquire timeouts alone still sat for the WHOLE 8-minute job budget
          # twice, cancelled with no test having run — the per-connection
          # timeouts did not cover whatever it was doing. `timeout` does, so a
          # mirror that is not answering costs 90s and three tries, and then
          # fails AS AN APT FAILURE with a message naming the cause, instead of
          # eating the job and looking like a sandbox regression.
          ok=
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get update \
                 -o Acquire::Retries=2 \
                 -o Acquire::http::Timeout=15 \
                 -o Acquire::https::Timeout=15; then
              ok=yes
              break
            fi
            echo "apt-get update attempt $attempt failed or timed out; retrying"
          done
          if [ -z "$ok" ]; then
            echo "::error::apt-get update did not complete in 3 bounded attempts."
            echo "::error::This is the Ubuntu mirror, not snug. Re-run the job."
            exit 1
          fi
          sudo timeout 120 apt-get install -y bubblewrap

      # pasta comes from UPSTREAM, not from apt, and that is not a preference.
      #
      # snug passes --map-host-loopback, which is THE flag that closes the host's
      # loopback to the sandbox. It arrived in passt 2024_08_21 and Ubuntu
      # 24.04's passt is from February 2024 — so on a stock runner pasta exits
      # instantly with "unrecognized option", snug correctly refuses to run the
      # payload, and the whole integration job failed at the version check. It
      # had been failing on every push for some time: the job was asserting the
      # runner was inadequate rather than testing snug.
      #
      # These are the upstream static x86_64 builds (no runtime deps, ~200 KB).
      # Both files are needed: `pasta` dispatches to `pasta.avx2` when the CPU
      # has it, and without the sibling it prints "Can't run AVX2 build" on
      # stderr for every single sandbox.
      #
      # `latest` is a moving target, deliberately. Pinning a build would go
      # stale and the version assertion below turns any upstream regression into
      # a loud failure in this step rather than a confusing one twenty tests
      # later — which is the same trade snug makes everywhere: no silent
      # downgrade, and the error names the fix.
      - name: Install pasta from upstream
        run: |
          for f in pasta pasta.avx2; do
            curl -fsSL --retry 3 -o "$f" "https://passt.top/builds/latest/x86_64/$f"
          done
          chmod +x pasta pasta.avx2
          sudo install -m 0755 pasta pasta.avx2 /usr/local/bin/

      # The harness makes the same check (requirePasta) so a developer machine
      # gets the same answer; this step exists so the runner reports it in the
      # step that installed the binary rather than twenty tests later.
      - name: Check pasta is new enough
        run: |
          command -v pasta
          pasta --version
          if ! pasta --help 2>&1 | grep -q -- --map-host-loopback; then
            echo "::error::this pasta predates --map-host-loopback (2024_08_21); snug cannot close the host loopback on it, so nothing below would be testing what it claims"
            exit 1
          fi

      # Ubuntu 24.04+ ships kernel.apparmor_restrict_unprivileged_userns=1,
      # which breaks bwrap. Named explicitly because a failure here otherwise
      # looks like a snug bug and costs an afternoon.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - run: make build

      # Not redundant with the harness: doctor is the first thing a human runs
      # on a new host, so a regression in it must not be invisible.
      - name: doctor
        run: ./bin/snug doctor

      - name: ${{ matrix.label }}
        env:
          # The harness SKIPS where the host cannot create namespaces, so a
          # laptop without bubblewrap degrades gracefully. CI must not: a green
          # run that silently checked nothing is the same failure mode as a
          # silent security downgrade. This turns every such skip into a
          # failure, so the job asserts the tests actually RAN.
          SNUG_REQUIRE_SANDBOX: '1'
          # Allows the checks that reach the public internet (egress via pasta).
          # With SNUG_REQUIRE_SANDBOX set, omitting this is itself a failure
          # rather than a silent loss of coverage.
          #
          # Kept in THIS step rather than split into a separate non-blocking one,
          # deliberately. There is exactly one such test (TestEgressWorks), its
          # curl is capped at --connect-timeout 5 --max-time 10, and it carries a
          # 20s budget — so it can no longer be the reason a job runs long. What
          # a separate non-blocking step would buy is the ability to ignore its
          # failure, and the only thing that proves egress works at all is this
          # test failing when it does not. Splitting it would be deleting the
          # coverage with extra steps.
          SNUG_TEST_NET: '1'
        run: make ${{ matrix.suite }}


  # Tier 3d: the ENGINE tier, against a real podman (issue #395).
  #
  # Every job above runs on `ubuntu-latest`, whose podman snug does not accept,
  # so the engine tests SKIP there — a green run measuring nothing, which is the
  # defect #395 exists to remove rather than a coverage wish. MEASURED on run
  # 33054984495: podman 5.8.4 at /usr/local/bin/podman, logged UNSUPPORTED, 27
  # tests skipping on `crun: unknown version specified` and 3 reaching their
  # marker. Since issue #458 they skip AT the version check instead, with a
  # message naming the version rather than blaming the host for being unable to
  # run a container.
  #
  # THAT SKIP IS PERMANENT, and installing a supported podman on the runner is
  # not an option somebody has merely not got round to. MEASURED against
  # Launchpad: every podman ever published to the Ubuntu archive tops out at
  # 5.8.6, with 26.04 LTS on 5.7.0 and no 6.x in any series, ever. The podman
  # project's own installation docs send Ubuntu users to that archive and
  # publish no PPA, and the old upstream route
  # (OBS devel:kubic:libcontainers:stable/xUbuntu_*) is 404 — its surviving
  # `unstable` sibling carries no podman package at all. Building podman from
  # source in CI or trusting a third-party static build are the only routes
  # left, and neither is one this repository wants in its supply chain.
  #
  # Three things make this job MEAN something, and each closes one half of that
  # defect:
  #
  #   SNUG_REQUIRE_ENGINE=1   "no usable real container engine" becomes t.Fatal
  #                           instead of t.Skip (containerengine_test.go's
  #                           requireRealEngine). The skip predicate is narrow
  #                           enough to trust — only exit 69 (exitUnavail)
  #                           counts as an absent engine; 77/64/70 are fatal
  #                           regardless — so this cannot convert a test bug
  #                           into "the runner has no podman".
  #   the engine floor        `make integration-sandbox` fails when fewer than
  #                           SNUG_ENGINE_FLOOR distinct tests reached the
  #                           "snug-engine-ran:" marker. Membership is REACHING
  #                           the marker, never a name sweep. MEASURED working:
  #                           run 32940873115 ended "engine tests: 0 of 33 ran
  #                           — podman version 6.0.2 at /bin/podman" and failed
  #                           the job.
  #   the supported set       engine.SupportedPodmanSet is podman 6.x, and with
  #                           SNUG_REQUIRE_ENGINE set an engine outside it is a
  #                           t.Fatal, not a warning. A green run against an
  #                           unsupported podman is the same lie as a green run
  #                           that skipped everything.
  #
  # openSUSE Tumbleweed, not Ubuntu, and that is the point: the engine version
  # floats with the host distribution since the pinned engine bundle was retired
  # (#384), so CI is only informative about a developer's result if it runs the
  # same major. The ubuntu-latest runner's podman is 5.8.4 — a different engine
  # from the 6.0.2 anyone here develops against, and one the supported set
  # refuses.
  # Tumbleweed's is podman-6.0.2-1.1, MEASURED identical to the development
  # host's, so CI matches by construction rather than by luck.
  #
  # # Why the container is LAUNCHED here rather than named in `container:`
  #
  # A GHA `container:` job runs every step inside the container via
  # `docker exec`, and it has no host shell at all. That makes
  # `kernel.apparmor_restrict_unprivileged_userns` unreachable: it is a HOST
  # sysctl, it is not namespaced, and a write from inside the container gets
  # EPERM. The three jobs above set it to 0 on their own runners — each job is a
  # fresh VM, so that does nothing for this one.
  #
  # MEASURED inside a `container:` job (run 32941285136), which is why this is
  # a shape and not a preference:
  #
  #   kernel/apparmor_restrict_unprivileged_userns = 1
  #   user/max_user_namespaces = 63838          (so NOT a nesting limit)
  #   CapBnd: 00000000a80425fb                  (docker default: no SYS_ADMIN)
  #   unshare --user --map-root-user -- true
  #     → unshare: write failed /proc/self/uid_map: Operation not permitted
  #
  # One root cause, two different-looking symptoms: `unshare` writes its own
  # uid_map from inside the new userns and is denied, while bwrap writes it from
  # the parent, gets through, and is then denied the netlink operation inside
  # the userns — run 32940873115's `bwrap: loopback: Failed RTM_NEWADDR:
  # Operation not permitted`. Do not read that message as a capability
  # shortage; adding `--cap-add` would have papered over it.
  #
  # So the job stays on the runner, sets the sysctl where it works, and launches
  # the Tumbleweed container itself. It is also NOT `--privileged` (#395's
  # unknown 3): with the restriction lifted host-wide, bwrap creates its own
  # userns and holds capabilities inside it, so the container needs only
  # apparmor=unconfined (docker-default denies mount(2)), seccomp=unconfined
  # (comes OUT once this job is green — it is here so a first failure is not
  # ambiguous between two filters), systempaths=unconfined, and /dev/fuse for
  # rootless fuse-overlayfs.
  #
  # --tmpfs /tmp is the FOURTH blocker, and it is the only one that is about
  # snug's own layout rather than the container's. The engine runroot is
  # os.TempDir()-rooted (internal/engine/paths.go:123, `filepath.Join(os.TempDir(),
  # "snug-engines-<uid>-<key>", "rr")`), docker's container root is overlayfs, and
  # the kernel refuses an overlay whose lower layer is itself overlayfs — so
  # buildah's build-context overlay failed EINVAL and every engine test read as
  # "a build succeeded but its RUN step never actually executed a container"
  # (run 32942740758):
  #
  #   mounting an overlay over build context directory: … lowerdir=/snug/engine/
  #   runroot/tmp/libpod_builder…, upperdir=…, workdir=…, userxattr: invalid argument
  #
  # A tmpfs at /tmp takes the runroot off overlayfs. `exec` because things run
  # from there; mode=1777 because it is /tmp. This is issue #399's subject
  # ("ephemeral per-run state belongs in /run/user/<uid> rather than /tmp") seen
  # from the outside: a runroot on /run/user/<uid> would not have needed a flag
  # here, since that path is a tmpfs on any systemd host.
  #
  # /dev/net/tun is the THIRD blocker, and it is a device node rather than a
  # policy knob: pasta puts a tap device in the sandbox's netns, docker does not
  # give a container the tun clone device, and every `-p @net` run died with
  # `pasta exited before the network came up: Failed to open() /dev/net/tun: No
  # such file or directory` (run 32942207790). doctor now opens that node itself
  # rather than reporting pasta's version, so a host missing it says so before a
  # test does.
  #
  # systempaths=unconfined is the narrowest answer to the SECOND blocker, which
  # only became visible once the sysctl cleared the first. Run 32941695379:
  # doctor reported `the stage starts — clone, uid map, loopback, and the netns
  # move` as OK, and then `bwrap: Can't mount proc on /newroot/proc: Operation
  # not permitted`. Docker masks entries under /proc with its own submounts, and
  # the kernel refuses a fresh procfs mount inside a user namespace when the
  # mounter's view of /proc is obstructed — so this is docker's masked paths,
  # not a capability, and --cap-add would not have touched it. The flag replaces
  # docker's MaskedPaths and ReadonlyPaths for this container; it does not make
  # the container privileged.
  #
  # The Go toolchain is MOUNTED from the runner rather than installed by zypper.
  # snug is cgo-free by constraint (.claude/design/NOCGO.md) and the Go
  # toolchain's own binaries are static Go, so the runner's toolchain executes
  # unchanged on Tumbleweed's glibc — and the version stays the one every other
  # job used instead of drifting with a distribution package.
  engine:
    name: real engine behaviour (Tumbleweed, podman 6.x)
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    # MEASURED, run 32943468831: 8m53s to reach `panic: test timed out after
    # 8m0s` with 19 of 33 engine tests run and still progressing. The suite bound
    # is 18m there (SNUG_SANDBOX_TIMEOUT, set by test/engine-container.sh), so
    # this has to sit above it — budget() per test, the suite bound, then this.
    # The fixed cost underneath is small: image pull 11s, zypper 14s, setup-go
    # 9s, `make build` 12s.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # See the gate job: this one has more reason still, since it launches
          # real sandboxes running real payloads, inside a container.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      # Ubuntu 24.04+ ships kernel.apparmor_restrict_unprivileged_userns=1,
      # which breaks bwrap — here AND one level down inside the container, since
      # the knob is not namespaced.
      #
      # Unlike the sibling jobs this one does NOT end at `|| true`. A value that
      # is still 1 after the write means nothing below is testing what it claims
      # (the whole reason this job exists), and `|| true` on its own would leave
      # that invisible: run 32941285136 read 1 inside the container and reported
      # it as `bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted`
      # twenty tests later. So the value is READ BACK and the job stops here if
      # it did not take.
      - name: Allow unprivileged user namespaces, and prove it took
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ] && [ "$(cat "$knob")" != 0 ]; then
            echo "::error::$knob is $(cat "$knob") after the write. bwrap cannot hold capabilities in its own user namespace with this set, so the engine suite below would fail on the first sandbox and report it as a loopback or uid_map error."
            exit 1
          fi

      # Everything about the container — its flags, its packages, its non-root
      # user, its subuid range — lives in test/engine-container.sh, which
      # `make integration-engine` also runs. A workflow file is the one place
      # those instructions must NOT live: nobody can run a yaml step locally,
      # so a failure here would only ever reproduce by pushing again.
      #
      # THE SCRIPT DIRECTLY, NOT THROUGH MAKE (issue #505). The script
      # classifies its own network failures and exits 75, EX_TEMPFAIL, saying
      # "so the code says so too" — and through make that sentence is false.
      # GNU make exits 2 on any recipe failure whatever the recipe exited,
      # MEASURED:
      #
      #   $ printf 't:\n\t@exit 75\n' > Makefile.probe
      #   $ make -f Makefile.probe t; echo "make exit=$?"
      #   make: *** [Makefile.probe:2: t] Error 75
      #   make exit=2
      #
      # It cannot be fixed inside the Makefile: re-raising 75 still exits 2,
      # and swallowing it would exit 0 and turn an infra incident green, which
      # #486 refused on purpose. This is the SAME single command the recipe
      # runs, so the rule above is untouched — the instructions stay in the
      # script and this file still only names it. TestTheEngineJobRunsTheScript
      # NotMake in test/guard is the ratchet.
      # ── THE PROVISIONED IMAGE IS RESTORED HERE, AND BAKED ONLY ON main ──────
      #
      # Issue #478's aim is to take openSUSE out of the day-to-day jobs, and the
      # previous arrangement did not achieve it. MEASURED 2026-08-29 over five
      # open PRs, `gh api repos/gomoni/snug/actions/caches`:
      #
      #   refs/heads/main      145MB buildkit-blob sha256:c7e34faa…  base 84c5006d…
      #   refs/pull/512..516   145MB FIVE DISTINCT shas              base 0d6936c5…
      #
      # Five bakes in about 2.5 hours, each running `zypper refresh` and
      # `zypper install` against download.opensuse.org, one of which failed
      # there (#516's first attempt: `repo-oss primary.xml.zst` not found on
      # medium, exit 4, classified 75, green on a re-run of the job alone).
      #
      # THE CAUSE WAS NOT THE WEEKLY EPOCH, and that is why this is a change of
      # mechanism rather than a longer expiry. All five PRs share ONE base blob
      # while main holds a different one, so `tumbleweed:latest` MOVED between
      # main's bake and those PRs; a new base digest invalidates the
      # `RUN … install-packages` layer beneath it, so the ISO-week build-arg
      # never becomes the binding constraint — the real rebuild rate is
      # Tumbleweed's publish rate. GHA cache scoping then finishes the job: a PR
      # reads main's scope but never another PR's, so every PR that misses bakes
      # its own copy.
      #
      # So the unit that is cached is the IMAGE, not the layers: `docker save`
      # on main, `docker load` everywhere. A layer cache cannot express "do not
      # build" — buildkit has no fail-on-cache-miss — and that sentence is the
      # whole feature here.
      #
      # WHO MAY REACH openSUSE: a push to main, and nothing else. A pull request
      # that misses the cache REFUSES with EX_TEMPFAIL instead of baking
      # (invariant 5 — a capability that is not available is a refusal, not a
      # quieter run). It does not fall back, because a fallback is exactly the
      # openSUSE dependency this removes.
      #
      # WHY THE ENGINE STILL MOVES, which is the other half of #478's ruling
      # (the repositories stay rolling — see test/engine-container.sh's IMAGE=):
      # the key carries the ISO week, so the first push to main in a new week
      # misses and bakes against live Tumbleweed. Within a week main restores
      # like everyone else. `restore-keys` is the same key without the week, so
      # a PR opened after the rollover but before main's next push runs against
      # LAST week's image rather than going red — at most seven days of drift,
      # and the drift is visible in the step's own log line.
      - name: Cache key for the provisioned image
        id: img
        run: |
          week=$(date -u +%G-W%V)
          prefix="snug-engine-image-${{ runner.os }}-${{ hashFiles('test/engine-container.sh', 'test/engine-container.dockerfile') }}-"
          {
            echo "week=$week"
            echo "prefix=$prefix"
            echo "key=${prefix}${week}"
          } >> "$GITHUB_OUTPUT"
          # The one condition under which this job may reach openSUSE.
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            echo "bakes=true" >> "$GITHUB_OUTPUT"
          else
            echo "bakes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the provisioned image
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/snug-engine-image/image.tar
          key: ${{ steps.img.outputs.key }}
          restore-keys: ${{ steps.img.outputs.prefix }}

      - name: Load the restored image
        if: steps.restore.outputs.cache-matched-key != ''
        run: |
          docker load -i /tmp/snug-engine-image/image.tar
          echo "restored ${{ steps.restore.outputs.cache-matched-key }} (this week is ${{ steps.img.outputs.key }})"

      # The refusal, and it is the point of the whole arrangement: no bake
      # outside main, so a pull request never downloads a package from openSUSE.
      # Exit 75 is EX_TEMPFAIL, the same code test/engine-container.sh uses for
      # "no test ran, and it is not this diff's fault" — issue #505's rule, so
      # anything keying on the code sees one meaning, not two.
      - name: Refuse to bake outside main
        if: steps.restore.outputs.cache-matched-key == '' && steps.img.outputs.bakes != 'true'
        run: |
          echo "::error title=No baked engine image in the cache::NO TEST RAN. The provisioned Tumbleweed image is baked only by a push to main (issue #478), and no entry matched ${{ steps.img.outputs.prefix }}*. This is not a change in this diff. Re-run once main has pushed, or bake by pushing to main."
          echo "engine-container: no cache entry matched ${{ steps.img.outputs.prefix }}*." >&2
          echo "                  NO TEST RAN. Only a push to main bakes the image." >&2
          echo "                  Exiting 75 (EX_TEMPFAIL) so the code says so too." >&2
          exit 75

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.restore.outputs.cache-matched-key == '' && steps.img.outputs.bakes == 'true'

      - name: Bake the provisioned Tumbleweed image
        if: steps.restore.outputs.cache-matched-key == '' && steps.img.outputs.bakes == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: test/engine-container.dockerfile
          build-args: CACHE_EPOCH=${{ steps.img.outputs.week }}
          load: true
          push: false
          tags: local/snug-engine-ci:latest

      # Saved as a tarball rather than as buildkit layers, for the reason in the
      # header: what a PR needs is an image it can load without building, and a
      # layer cache cannot refuse to build.
      - name: Save the provisioned image for every other job
        if: steps.restore.outputs.cache-matched-key == '' && steps.img.outputs.bakes == 'true'
        run: |
          mkdir -p /tmp/snug-engine-image
          docker save local/snug-engine-ci:latest -o /tmp/snug-engine-image/image.tar
          ls -l /tmp/snug-engine-image/image.tar

      - name: Cache it under this week's key
        if: steps.restore.outputs.cache-matched-key == '' && steps.img.outputs.bakes == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/snug-engine-image/image.tar
          key: ${{ steps.img.outputs.key }}

      # SNUG_ENGINE_IMAGE names the baked image, which the script already
      # supports and which is all the wiring the cache needs: engine-container.sh
      # sees the image is local and does not pull, and provision sees the tools
      # are present and does not run zypper. Unset — a developer running
      # `make integration-engine` — it pulls Tumbleweed and provisions at run
      # time exactly as before.
      - name: The engine suite, in a Tumbleweed container
        run: SNUG_ENGINE_IMAGE=local/snug-engine-ci:latest ./test/engine-container.sh
