# project
# Generated by snug-setup; snug reads it like any other profile.
[profile.app]
description = "app, vyskocilm"
include = [
  # @parent-ro: The target's parent directory is readable — every sibling project in it too.
  "@parent-ro",
  # vyskocilm: GitHub account vyskocilm: its ssh key, its gh token, its ...
  "vyskocilm",
]
# identity
# Generated by snug-setup; snug reads it like any other profile.
[profile.vyskocilm]
description = "GitHub account vyskocilm: its ssh key, its gh token, its git author, its signing key."

# identity: each block is its own pin; two profiles setting one block differently are refused.
[profile.vyskocilm.identity.ssh]
key = "{home}/.ssh/github_auth.pub" # the PUBLIC half
agent = "proxy"
[profile.vyskocilm.identity.git]
name = "Michal V"
email = "m@example.org"
signing_key = "{home}/.ssh/github_sign.pub" # the PUBLIC half; commits are signed through the agent proxy
[profile.vyskocilm.identity.gh]
user = "vyskocilm"
