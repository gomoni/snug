# Generated by snug-setup; snug reads it like any other profile.
# intent (you): "add ~/go/bin to PATH, vim, my pager, scratch /work" -> ro ~/go/bin, env PATH (prepend), env EDITOR (set), env PAGER (inherit), tmpfs /work
[profile.tools]
ro = ["~/go/bin"]
tmpfs = ["/work"]

[profile.tools.environ.set]
EDITOR = "vim"

[profile.tools.environ.inherit]
PAGER = true

[profile.tools.environ.prepend]
PATH = ["~/go/bin"]
