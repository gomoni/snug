# Generated by snug-setup; snug reads it like any other profile.
# intent (you): "run claude, read the siblings, my gh" -> @claude, @parent-ro, stage ~/bin/gh as gh
[profile.agent]
include = [
  # @claude: Claude Code: binary and skills read-only, credentials projected and settings generated.
  "@claude",
  # @parent-ro: The target's parent directory is readable — every sibling project in it too.
  "@parent-ro",
]
ro = ["~/bin/gh:/snug/bin/gh"]
