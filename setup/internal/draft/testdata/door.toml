# Generated by snug-setup; snug reads it like any other profile.
# intent (you): "serve my web app" -> @net, door web
[profile.serve]
include = [
  # @net: Internet access via a private network namespace. Host loopback unreachable.
  "@net",
]
# listen_names: names your server accepts connections under; `snug proxy DIR` opens them in your browser.
listen_names = ["web"]
