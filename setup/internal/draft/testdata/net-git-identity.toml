# Generated by snug-setup; snug reads it like any other profile.
# intent (you): "needs internet and my git name" -> @net, @git
[profile.work]
include = [
  # @net: Internet access via a private network namespace. Host loopback unreachable.
  "@net",
  # @git: Your git name and email, extracted from the host config. Generated, never bound.
  "@git",
]

# identity: the sandbox acts as this one account; a second account is a second profile.
[profile.work.identity.ssh]
key = "{home}/.ssh/id_work.pub" # the PUBLIC half
agent = "proxy"
[profile.work.identity.git]
name = "Alice Doe"
email = "alice@corp.example"
[profile.work.identity.gh]
user = "alice-corp"
