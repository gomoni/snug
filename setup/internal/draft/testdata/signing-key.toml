# Generated by snug-setup; snug reads it like any other profile.
[profile.signer]
include = [
  # @net: Internet access via a private network namespace. Host loopback unreachable.
  "@net",
]

# identity: each block is its own pin; two profiles setting one block differently are refused.
[profile.signer.identity.ssh]
key = "{home}/.ssh/id_auth.pub" # the PUBLIC half
agent = "proxy"
[profile.signer.identity.git]
name = "Alice Doe"
email = "alice@corp.example"
signing_key = "{home}/.ssh/id_sign.pub" # the PUBLIC half; commits are signed through the agent proxy
[profile.signer.identity.gh]
user = "alice-corp"
