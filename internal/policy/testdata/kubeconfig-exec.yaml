apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
    server: https://aks-entra.example.azmk8s.io:443
  name: aks-entra
- cluster:
    server: https://EKS0.gr7.eu-west-1.eks.amazonaws.com
  name: eks-demo
- cluster:
    server: https://iam.example.com
  name: eks-iam
- cluster:
    server: https://gke.example.com
  name: gke
contexts:
- context:
    cluster: aks-entra
    user: clusterUser_rg_aks-entra
  name: aks-entra
- context:
    cluster: eks-demo
    user: eks-demo
  name: eks-demo
- context:
    cluster: eks-iam
    user: eks-iam
  name: eks-iam
- context:
    cluster: gke
    user: gke
  name: gke
current-context: aks-entra
kind: Config
preferences: {}
users:
- name: clusterUser_rg_aks-entra
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      args:
      - get-token
      - --environment
      - AzurePublicCloud
      - --server-id
      - 6dae42f8-4368-4678-94ff-3960e28e3630
      - --client-id
      - 80faf920-1908-4b52-b5ef-a8e7bedfc67a
      - --tenant-id
      - 00000000-0000-0000-0000-000000000000
      - --login
      - azurecli
      command: kubelogin
      env: null
      installHint: |2

        kubelogin is not installed which is required to connect to AAD enabled cluster.
      interactiveMode: IfAvailable
      provideClusterInfo: false
- name: eks-demo
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      args:
      - --region
      - eu-west-1
      - eks
      - get-token
      - --cluster-name
      - demo
      - --output
      - json
      command: aws
      env:
      - name: AWS_PROFILE
        value: FIXTUREPROFILEVALUE
- name: eks-iam
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      args:
      - token
      - -i
      - demo
      command: /usr/local/bin/aws-iam-authenticator
- name: gke
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: gke-gcloud-auth-plugin
