# snug builtin profiles.
#
# Every profile here is a NAMED HOLE in a sandbox that starts out sharing
# nothing. There is no key in this format that can take something away — see
# .claude/design/INDEX.md §2.4. If you find yourself wanting one, the answer is a finer
# grant, not a subtraction.
#
# Each profile that opens something a hostile process could use says, in a
# comment, what that process could do with it at full abuse. If you add a
# profile and cannot write that sentence, it is not ready to ship.
#
# NAMES. Written here bare, published with a leading @: [profile.sys] below is
# `@sys` everywhere a human sees it — on the command line, in --dry-run
# provenance, in SNUG_PROFILES. snug adds the mark when it loads this file
# (internal/profile/builtin.go), and refuses a leading @ in EVERY file it parses,
# this one included. So do not write one here; the mark means "snug ships this",
# and it stays true because no file can claim it and no builtin can miss it.
# `include` is rewritten with the names, so write those bare as well.

# ── the OS runtime ───────────────────────────────────────────────────────────
# ABUSE: the sandbox can read every world-readable file in /usr and the few /etc
# entries below. It gains no authority it did not already have — snug runs as
# your uid, so these are bytes you could already cat.
#
# /etc is ENUMERATED, not bound wholesale, and the reason is not confidentiality.
# It is that /etc/profile.d/* and /etc/bash.bashrc are EXECUTED by every shell in
# the sandbox. Binding all of /etc therefore injects host-controlled code into
# the sandbox's startup — on this developer's box, distrobox's profile script
# re-derives DBUS_SESSION_BUS_ADDRESS from the uid and calls host-spawn. A distro
# ships a pile of such helpful scripts; distrobox exists to maximise that
# integration and snug exists to minimise it.
#
# The maintenance cost of this list is real and accepted. Two entries here were
# found by breakage, not by reading: /etc/crypto-policies (openssl.cnf has
# `.include = /etc/crypto-policies/back-ends/opensslcnf.config`, and without it
# every TLS client dies with MODULE_INITIALIZATION_ERROR) and
# /var/lib/ca-certificates (/etc/ssl/certs is a symlink OUT of /etc into it).
# When you add to this list, test with: python3 -c "import ssl;
# print(len(ssl.create_default_context().get_ca_certs()))"
[profile.sys]
description = "Read-only OS runtime: /usr plus the few /etc files things actually need."
ro = [
  "/usr",
  "/opt",

  # dynamic linker — without these nothing executes at all
  "/etc/ld.so.cache",
  "/etc/ld.so.conf",
  "/etc/ld.so.conf.d",

  # TLS trust
  "/etc/ssl",
  "/etc/pki",
  "/etc/ca-certificates",
  "/etc/ca-certificates.conf",
  "/etc/crypto-policies",
  "/var/lib/ca-certificates",
  "/usr/share/ca-certificates",

  # identity and name lookup (generated by snug in a later milestone)
  "/etc/nsswitch.conf",
  "/etc/passwd",
  "/etc/group",

  # locale, timezone, and distro detection that tools branch on
  "/etc/localtime",
  "/etc/os-release",
  "/etc/alternatives",
]
optional = [
  "/opt",
  "/etc/ld.so.conf.d",
  "/etc/ssl",
  "/etc/pki",
  "/etc/ca-certificates",
  "/etc/ca-certificates.conf",
  "/etc/crypto-policies",
  "/var/lib/ca-certificates",
  "/usr/share/ca-certificates",
  "/etc/localtime",
  "/etc/os-release",
  "/etc/alternatives",
]
symlink = [
  { at = "/bin",   target = "usr/bin"   },
  { at = "/sbin",  target = "usr/sbin"  },
  { at = "/lib",   target = "usr/lib"   },
  { at = "/lib64", target = "usr/lib64" },
]

# There is deliberately NO `etc-full` builtin. A profile granting all of /etc is
# one line —
#
#   [profile.etc-full]
#   ro = ["/etc"]
#
# — that anyone can put in ~/.config/snug/profiles.d/. Shipping it bought nothing
# but a maintenance obligation and a thing to explain. snug ships the curated
# /etc above; whoever wants the whole tree writes that line and accepts what
# comes with it (every script in /etc/profile.d and /etc/bash.bashrc then RUNS
# inside the sandbox, so the distribution injects code into the agent's shell).
# Same minimalism as having no --read-only: the tool stays small, and the escape
# hatch is the profile format itself.

# ── an ephemeral, writable HOME ──────────────────────────────────────────────
# $HOME is the same absolute path as on the host, because tooling bakes absolute
# paths and the target usually lives under it. It is a tmpfs because persistence
# in $HOME is the primary escape-into-your-next-session vector: .bashrc,
# .profile, .config/autostart, .local/bin shadowing a command on your PATH.
#
# ABUSE: a hostile process inside the sandbox can write anything it likes into
# any of these directories. All of it dies with the sandbox — none of them is a
# host path — so what it buys an attacker is a place to stage files for the rest
# of THIS run, not a foothold in the next one.
#
# {home}/.local/share is the fifth entry and the newest. It is here because
# XDG_DATA_HOME below names it, and a profile must grant every path it names
# (§2.5): without the tmpfs the variable would point at a directory that is not
# inside, and every tool honouring XDG would fail on a path snug itself wrote.
[profile.home]
description = "$HOME is an empty tmpfs at the host path. Writable, ephemeral."
tmpfs = [
  "{home}",
  "{home}/.cache",
  "{home}/.config",
  "{home}/.local/state",
  "{home}/.local/share",
]

# The XDG base directories, pointed at the tmpfs directories immediately above.
#
# ABUSE: a hostile process inside the sandbox can use these to make any tool that
# honours XDG write its state into the ephemeral tmpfs — which is exactly the
# point. Nothing here reaches a host path, each value names a directory this same
# profile creates, and a variable grants nothing on its own: it only tells a tool
# where to look.
#
# They are `set` and not `inherit` deliberately. The host's XDG_CONFIG_HOME names
# a real directory full of real credentials, and admitting it past --clearenv
# would point every tool in the sandbox at a path the sandbox does not have —
# which is the good case. The bad one is a host that has moved XDG_CONFIG_HOME
# somewhere @home does not cover, where the tool would silently fall back to
# writing wherever that says.
[profile.home.environ.set]
XDG_CONFIG_HOME = "{home}/.config"
XDG_CACHE_HOME = "{home}/.cache"
XDG_STATE_HOME = "{home}/.local/state"
XDG_DATA_HOME = "{home}/.local/share"

# ── the project ──────────────────────────────────────────────────────────────
# ABUSE: the sandbox can rewrite anything in the target directory. That is the
# point, and it is why you review diffs. Nothing else persists.
[profile.cwd-rw]
description = "The target directory is writable and persists."
include = ["home"]
rw = ["{target}"]

# The target's parent is readable. Everything under higher ancestors stays
# invisible — not hidden, never granted. This is one line because the model has
# no hiding operation to get wrong.
[profile.parent-ro]
description = "The target's parent directory is readable."
ro = ["{target_parent}"]

# ── a /tmp the host can also see ─────────────────────────────────────────────
# ABUSE: anything the sandbox writes here is visible to the host, and to any
# other snug run on the same project. That is the point — it is how you hand a
# file to a host tool — but it means /tmp is no longer a dead end for data
# leaving the sandbox. Do not select it and then treat /tmp as private.
#
# The directory is per-project (named from a hash of the target) so a build
# cache stays warm across runs and two projects never share one. snug refuses to
# use it if it is a symlink, is owned by someone else, or is group/world
# accessible — the classic /tmp races.
[profile.tmp-shared]
description = "A per-project host directory becomes the sandbox's /tmp. Survives the sandbox."
rw = ["{host_tmpdir}:/tmp"]

# ── git identity, generated ──────────────────────────────────────────────────
# ABUSE: the sandbox learns the name and email you commit under, and nothing
# else from your git config. It is a name and an address, both of which are in
# every commit you have ever pushed.
#
# THIS PROFILE USED TO BIND ~/.gitconfig READ-ONLY, AND THAT WAS THE WRONG SHAPE.
# The file is not a data file with a name and an email in it — it is a COMMAND
# TABLE. credential.helper, alias.x = !cmd, core.pager, core.sshCommand,
# diff.*.textconv, filter.*.clean/smudge and core.fsmonitor all name programs for
# git to run, and binding the file read-only does not stop any of them: it
# SUPPLIES them. The old abuse sentence here called the hazard "secrets you
# unwisely put in ~/.gitconfig", which reads as a user error and understates a
# file whose keys are executable by design.
#
# So snug reads it as DATA and generates the config the sandbox sees, keeping
# only keys that carry no execution: user.name, user.email, init.defaultBranch.
# `includeIf "gitdir:"` is honoured — snug evaluates the condition itself against
# the target — so a per-directory identity keeps working. `includeIf
# "hasconfig:"` is refused and named on stderr, because that condition is decided
# by the REPOSITORY's own config: measured, a repo whose only property was a
# crafted remote URL pulled in a host file carrying credential.helper = !command.
#
# Not in `defaults`: it reads a host file, and reading a host file is a thing a
# human should ask for. Combine with an [identity] block and the block wins —
# a pin that a host value could override would not be a pin.
#
# The generated file bounds what the HOST's config can say inside the sandbox.
# It does not bound what the SANDBOX can say: GIT_CONFIG_COUNT/GIT_CONFIG_KEY_0
# enter git above every file (measured — issue #26), so a process in here can
# give itself core.sshCommand whatever this file holds. That costs an attacker
# nothing it did not already have — it already runs code and already holds
# SSH_AUTH_SOCK — but do not read the generated file as a restraint on the
# sandbox. See .claude/design/GIT-CONFIG.md §9.
[profile.git-ro]
description = "Your git name and email, extracted from the host config. Generated, never bound."
git = "extract"

# ── networking ───────────────────────────────────────────────────────────────
# ABUSE: the sandbox can reach the whole internet — exfiltrate anything it can
# read, fetch and run anything it likes. What it CANNOT reach is the host's
# 127.0.0.1, and it cannot reach abstract AF_UNIX sockets (X11, D-Bus) because
# those are scoped by the network namespace. Those two closures are the point.
#
# There is deliberately no "offline" profile. Offline is the ABSENCE of this
# one, which is why it cannot be switched back on by adding something.
[profile.net]
description = "Internet access via a private network namespace. Host loopback unreachable."
network = "egress"
dns = true

# ── publishing a port back to the host ───────────────────────────────────────
# ABUSE: the named port on the host's 127.0.0.1 reaches whatever the sandbox has
# listening there — so anything you publish, a hostile process inside can answer.
# The forward is bound to 127.0.0.1 only, never the LAN.
#
# There is no builtin for this, and no "publish whatever the sandbox binds".
# Write the ports you mean, in your own profile:
#
#   [profile.myports]
#   include = ["@net"]
#   publish = [3000, 8080]
#
# Two reasons it is a human naming ports rather than a switch.
#
# The design reason (INDEX §4.6): with `auto` the SANDBOX chooses what appears
# on your loopback, which inverts the guiding principle — a prompt-injected agent
# could squat 127.0.0.1:8080 ahead of your own dev server and intercept your
# browser.
#
# The empirical one: a `net-publish` profile shipped here with publish_auto, and
# it NEVER WORKED. pasta's `-t 127.0.0.1/auto` scans the namespace for bound
# ports once, when pasta starts — which is before the payload exists, so there is
# nothing to find and nothing is ever forwarded. Measured at 3, 10, 20 and 30
# seconds after a listener came up inside: connection refused every time, while
# --dry-run said "EVERY port the sandbox binds". A claim snug does not deliver is
# invariant 5's territory, and the honest fix for a capability that cannot work
# is to stop offering it.

# The sandbox does not learn your LAN address. pasta copies the host's addresses
# into the namespace by default, which is a small information disclosure.
[profile.net-anon]
description = "As net, but the sandbox gets a synthetic address instead of the host's."
include = ["net"]
address = "10.13.13.2/24"
gateway = "10.13.13.1"

# ABUSE: EVERYTHING. The host's loopback (every service you run locally), every
# abstract AF_UNIX socket including X11 — which means keylogging and screenshots
# of your whole desktop — and the LAN with the host's identity. This is not a
# sandbox with networking; it is a process with a different filesystem view.
# Exists so "I need to debug a host service" does not become "so I stopped using
# snug". Requires --i-know.
[profile.net-host]
description = "DANGEROUS. Shares the HOST network namespace. Requires --i-know."
network = "host"

# ── what a bare `snug <dir>` selects ─────────────────────────────────────────
# There is deliberately NO [profile.default] here. What a bare `snug <dir>`
# selects is a PREFERENCE, not a grant: it is the `defaults` setting in
# ~/.config/snug/config.toml, whose built-in value lives in
# internal/profile/defaults.go. A profile that grants nothing still showed up in
# SNUG_PROFILES, in `snug profile tree` and in every Mount's provenance as
# though it were a hole in the sandbox, and it duplicated an idea the config
# file already expressed. One idea, one mechanism.

# ── identity: one git/ssh/gh account, and nothing else ───────────────────────
# ABUSE: the sandbox gets a SIGNING ORACLE for one ssh key. It can push to any
# repository that key can reach, and authenticate to any host that trusts it.
# Pinning bounds WHICH identity, not WHAT is done with it — that is inherent to
# every agent forwarder, not a gap to be closed later. ~/.ssh is never mounted,
# so no key material enters the sandbox and the other keys in your agent cannot
# be enumerated or used.
#
# This profile is a TEMPLATE: copy it into ~/.config/snug/profiles.d/ and fill in
# your own account. It grants nothing on its own.
#
#   [profile.work]
#   include = ["net", "git-ro"]     # the `defaults` are selected as well; -p adds
#     [profile.work.identity]
#     gh_user   = "you"
#     git_name  = "Your Name"
#     git_email = "you@example.com"
#     ssh_key   = "{home}/.ssh/id_ed25519.pub"   # the PUBLIC half
#     ssh_mode  = "agent-proxy"
#
# TWO ACCOUNTS ARE TWO PROFILES, and that needs no mechanism snug does not have.
# Write the block twice with different keys and different gh_user values; each
# sandbox then acts as one account through BOTH channels — gh and git-over-ssh —
# and cannot act as the other. Selecting both at once is a hard error naming
# them, because an identity is a pin and two pins are a contradiction rather
# than a union. VERIFY.md §13 is the by-hand check, negatives included.
#
# The gh binary must be INSIDE for the staged token to be usable, and it is not
# always under /usr — a tarball in ~/bin is common, and then @sys does not carry
# it. One read-only bind into the directory snug stages commands in:
#
#   [profile.gh-cli]
#   ro = ["{home}/bin/gh_X.Y.Z_linux_amd64/bin/gh:/run/snug/bin/gh"]
#
# Not a builtin, deliberately: the path is host-specific, and a profile that
# guesses wrong would fail at a different layer than the one the human wrote.

# ── Claude Code ──────────────────────────────────────────────────────────────
# ABUSE: the sandbox can spend your Anthropic credits and read your Claude
# settings and personal skills. It CANNOT read your host session history, your
# MCP server configuration, the list of projects on this machine, or any other
# project's transcripts. That last clause was written before it was true — the
# staged ~/.claude.json carried mcpServers and all seven host project paths
# until issue #19; grep for the property before you believe the sentence.
#
# Credentials are staged as a writable COPY — ~/.claude/.credentials.json, and
# nothing else — so a token refreshed inside does not reach the host.
#
# ~/.claude.json is NOT copied. It is GENERATED: at most three keys, no host
# bytes (cmd/snug/claude.go, claudeStateJSON). Enough that Claude Code opens on
# the prompt instead of the theme picker, and nothing more. MEASURED: Claude Code
# connects and works with the host file absent; only .credentials.json is
# load-bearing. The comment that used to sit here said the opposite and carried
# that decision for a milestone (issue #19).
#
# THE TRUST DIALOG IS NOT SUPPRESSED, and this profile is where that matters
# most. snug writes projects.<target>.hasTrustDialogAccepted only when the HOST's
# ~/.claude.json already records that exact directory as trusted — it carries the
# human's own answer and never invents one. Written unconditionally (it was, for
# one commit) it removes Claude Code's "Quick safety check" for a fresh clone of
# an unfamiliar repository, and MEASURED A/B on a fixture whose only content is
# .claude/settings.json with a SessionStart hook: with the key, no dialog and the
# repo's hook FIRES at startup; without it, the dialog blocks and the hook does
# not run. `snug -p @claude <unfamiliar-repo> -- claude` is exactly the review
# workflow this profile exists for, and the sandbox holds the staged OAuth token.
#
# Costs, all real and all intended: MCP servers configured on the host are not
# configured here (a .mcp.json committed in the TARGET still is — it is in the
# project tree, not the host's config); tool approvals given in a host session
# are asked again inside; and a directory you have not trusted on the host is
# asked about once per run.
[profile.claude]
description = "Claude Code: binary and skills read-only, credentials staged writable."
include = ["sys", "home"]
#
# The BINARY lands at /run/snug/bin/claude, not at its host path. snug stages
# every executable it puts in front of the payload in that one directory,
# because that directory is not writable from inside — see the note under `ro`
# below and CLAUDE.md's shadow-slot rule.
ro = [
  "{home}/.local/bin/claude:/run/snug/bin/claude",
  "{home}/.local/share/claude",
  "{home}/.claude/settings.json",
  "{home}/.claude/skills",
  "{home}/.claude/plugins",
]
optional = [
  "{home}/.local/bin/claude",
  "{home}/.local/share/claude",
  "{home}/.claude/settings.json",
  "{home}/.claude/skills",
  "{home}/.claude/plugins",
]

# Host variables re-admitted past --clearenv, one name per line.
#
# ABUSE: a hostile process inside the sandbox can read every one of these out of
# /proc/self/environ, and so can every child it spawns. That is the whole cost of
# `inherit` and the reason the list is five names rather than a prefix: each is
# an endpoint or a preference, none is a credential.
#
# ANTHROPIC_API_KEY is deliberately NOT here, and must not come back.
#
# /proc/self/environ is passively readable by every process in the sandbox and
# is inherited by every child, so a variable is the worst place to put a
# long-lived credential — CLAUDE.md's rule is "put the secret in a file, not the
# environment". Claude Code also PREFERS the key over the OAuth token when both
# are present, so passing it made the sandbox use the more dangerous of the two
# credentials it had. Without it Claude authenticates from the staged, writable
# copy of ~/.claude/.credentials.json (cmd/snug/claude.go), which is a file the
# payload has to open on purpose and which never syncs a modified token back
# without structural validation.
#
# ANTHROPIC_BASE_URL stays: it names an endpoint, not a credential, and users
# behind a gateway need it. If you need the key inside, that is a decision to
# make explicitly and per-run, not a line in a shipped profile.
[profile.claude.environ.inherit]
ANTHROPIC_BASE_URL = true
EDITOR = true
VISUAL = true
PAGER = true
NO_COLOR = true

# This profile deliberately has NO `environ.merge PATH`, and what replaced it is
# the point rather than a tidy-up.
#
# The binary still has to be findable — the default PATH is
# /usr/bin:/bin:/usr/sbin:/sbin, so `snug -p @claude . -- claude` once answered
# "execvp claude: No such file or directory" while the bind sat right there in
# --dry-run. The fix then was `merge PATH = ["{home}/.local/bin"]`, and it was
# WRONG in a way that took a review of §9.2 to see: {home} is a writable tmpfs,
# so that line put a directory the PAYLOAD CAN WRITE TO ahead of /usr/bin. The
# payload writes `git` into it and the next `git` a human or another agent runs
# inside the sandbox is that file. Nothing about the bind of `claude` was unsafe;
# the DIRECTORY it lived in was.
#
# Now the binary is bound at /run/snug/bin/claude and snug adds /run/snug/bin to
# PATH itself, in its own band, whenever anything is staged there — so no profile
# names a PATH directory at all and none can pick a writable one by accident.
# See policy.StagedBinDir and CLAUDE.md.
#
# ABUSE: a hostile process inside the sandbox can run whatever is in
# /run/snug/bin ahead of the distro's copy of the same name — and it cannot add
# to it, because that directory sits on the root tmpfs and --remount-ro / covers
# it (measured: `touch` and `echo >` both EROFS).

# There is deliberately NO `local-path` builtin granting all of ~/.local/bin.
# Same reasoning as `etc-full` above, and the same one-line escape hatch:
#
#   [profile.local-bin]
#   ro = ["{home}/.local/bin"]
#
#   [profile.local-bin.environ.merge]
#   PATH = ["{home}/.local/bin"]
#
# What it costs is why snug does not ship it. ~/.local/bin is wherever pipx, uv,
# cargo-install and your own scripts land — a mixed, personal, host-managed set.
# Granting the directory tells the sandbox what tools you have and lets it run
# all of them, when what you wanted was one. That is the "X but not Y" smell from
# CLAUDE.md pointing at too coarse a grant: if you want a tool in the sandbox,
# name that tool, the way this profile names `claude`.
#
# Read the second cost off the two lines above as well, because it is the one
# @claude got wrong for a milestone. That `ro` grant covers the DIRECTORY, so
# {home}/.local/bin is a real read-only bind and the `merge` is safe — a payload
# cannot write into it. Drop the `ro` line and keep the `merge`, and the same two
# lines put a writable tmpfs directory ahead of /usr/bin instead. The verb that
# made it safe is the grant, not the merge.

# ── containers ───────────────────────────────────────────────────────────────
# ABUSE: the sandbox can run containers, pull arbitrary images, and execute
# whatever is in them. Every request goes through a filtering proxy over an
# engine that is PRIVATE to this sandbox, so the host's images, containers and
# volumes are untouched and unreachable. A container may bind only what the
# sandbox itself can see; --privileged, host networking, device passthrough and
# published ports are all refused.
#
# LIMITATION, stated because it will otherwise look like a bug: containers run
# in the ENGINE's network namespace, not the sandbox's. `podman run -p 8080:80`
# followed by `curl localhost:8080` from the sandbox will NOT work. Use
# container-to-container networking. Making published ports reachable needs the
# engine inside the sandbox's netns, which is a further milestone.
#
# THAT SAME SENTENCE IS A HOLE IN THE NETWORK BOUNDARY, which is why `net` is
# included below. Read it the other way round: if a container runs in the
# ENGINE's netns, it has the ENGINE's network — so a sandbox with only
# `@podman-socket` could `wget` any URL from inside a container and read the
# response back out through `containers/{id}/logs`. Measured, not inferred
# (.claude/design/ENGINE-NETNS.md §0). Meanwhile `--dry-run` printed
# "No egress. No host loopback."
#
# `include = ["net"]` makes the profile tell the truth: selecting it grants
# egress, and `--dry-run` now says so. It does NOT narrow the hole — it stops
# snug asserting a guarantee it was not delivering, which is invariant 5. The
# cost is real and is accepted deliberately: you cannot have containers AND
# offline, and the sandbox itself gets network it did not separately ask for.
#
# THIS LINE IS INTERIM AND MUST BE REMOVED. The fix is topology A — the engine
# inside the SANDBOX's netns — after which container network == sandbox network,
# `@podman-socket` without `@net` is genuinely offline, published ports start
# working from the sandbox, and `include = ["net"]` becomes actively wrong
# because offline goes back to being the ABSENCE of a profile. That work is
# designed and its feasibility is measured, on this host, in
# .claude/design/ENGINE-NETNS.md — §5 is the implementation shape, §3 is where
# it does not work (distrobox, no subuid delegation, cgroup delegation).
[profile.podman-socket]
description = "Containers via a filtering proxy over a per-sandbox podman engine. Includes @net (interim: containers run on the engine's network — see .claude/design/ENGINE-NETNS.md)."
include = ["sys", "home", "net"]
podman = "socket"
# podman reads its registries, signature policy and defaults from here. Without
# it the client fails with an error that names none of that.
ro = ["/etc/containers"]
optional = ["/etc/containers"]

# ── building images ──────────────────────────────────────────────────────────
# ABUSE: the sandbox can build an image from a Dockerfile it wrote, which means
# running arbitrary commands in a container — but that is already true of
# `@podman-socket`, so this adds no new execution. What it adds is a SECOND SET
# OF OPTIONS to get wrong: a build can ask for host binds (`-v`), a host path as
# a named context (`--build-context x=/etc`), host devices, host networking and
# a chosen seccomp profile, none of it through HostConfig. Every one of those is
# judged, `-v` and `--build-context` by the same visibility rule as any other
# mount, and anything snug has not been taught about is refused by name.
#
# Separate from `@podman-socket` for exactly that reason: someone who only wants
# to RUN containers should not carry the build surface as well.
[profile.podman-build]
description = "As podman-socket, plus `podman build` with a filtered option set."
include = ["podman-socket"]
podman = "build"
