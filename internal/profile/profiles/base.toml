# snug builtin profiles.
#
# Every profile here is a NAMED HOLE in a sandbox that starts out sharing
# nothing. There is no key in this format that can take something away — see
# .claude/design/INDEX.md §2.4. If you find yourself wanting one, the answer is a finer
# grant, not a subtraction.
#
# Each profile that opens something a hostile process could use says, in a
# comment, what that process could do with it at full abuse. If you add a
# profile and cannot write that sentence, it is not ready to ship.
#
# NAMES. Written here bare, published with a leading @: [profile.sys] below is
# `@sys` everywhere a human sees it — on the command line, in --dry-run
# provenance, in SNUG_PROFILES. snug adds the mark when it loads this file
# (internal/profile/builtin.go), and refuses a leading @ in EVERY file it parses,
# this one included. So do not write one here; the mark means "snug ships this",
# and it stays true because no file can claim it and no builtin can miss it.
# `include` is rewritten with the names, so write those bare as well.

# ── the OS runtime ───────────────────────────────────────────────────────────
# ABUSE: the sandbox can read every world-readable file in /usr and the few /etc
# entries below. It gains no authority it did not already have — snug runs as
# your uid, so these are bytes you could already cat.
#
# /etc is ENUMERATED, not bound wholesale, and the reason is not confidentiality.
# It is that /etc/profile.d/* and /etc/bash.bashrc are EXECUTED by every shell in
# the sandbox. Binding all of /etc therefore injects host-controlled code into
# the sandbox's startup — on this developer's box, distrobox's profile script
# re-derives DBUS_SESSION_BUS_ADDRESS from the uid and calls host-spawn. A distro
# ships a pile of such helpful scripts; distrobox exists to maximise that
# integration and snug exists to minimise it.
#
# The maintenance cost of this list is real and accepted. Two entries here were
# found by breakage, not by reading: /etc/crypto-policies (openssl.cnf has
# `.include = /etc/crypto-policies/back-ends/opensslcnf.config`, and without it
# every TLS client dies with MODULE_INITIALIZATION_ERROR) and
# /var/lib/ca-certificates (/etc/ssl/certs is a symlink OUT of /etc into it).
# When you add to this list, test with: python3 -c "import ssl;
# print(len(ssl.create_default_context().get_ca_certs()))"
[profile.sys]
description = "Read-only OS runtime: /usr plus the few /etc files things actually need."
ro = [
  "/usr",
  "/opt",

  # dynamic linker — without these nothing executes at all
  "/etc/ld.so.cache",
  "/etc/ld.so.conf",
  "/etc/ld.so.conf.d",

  # TLS trust
  "/etc/ssl",
  "/etc/pki",
  "/etc/ca-certificates",
  "/etc/ca-certificates.conf",
  "/etc/crypto-policies",
  "/var/lib/ca-certificates",
  "/usr/share/ca-certificates",

  # identity and name lookup
  #
  # nsswitch.conf is OPTIONAL because openSUSE ships it under /usr/etc and the
  # /etc copy is absent on the container images — measured: no
  # /etc/nsswitch.conf in registry.opensuse.org/opensuse/tumbleweed:latest,
  # only /usr/etc/nsswitch.conf, 2222 bytes. Required, it refused that image
  # outright (exit 77, `profile "@sys" grants "/etc/nsswitch.conf" which does
  # not exist`), which is a legitimate distribution layout snug would not run
  # on.
  #
  # glibc falls back there by itself, and the vendor copy is ALREADY inside
  # under this profile's own /usr bind, so it needs no grant of its own.
  # Measured under bwrap with a tmpfs /etc: openat /etc/nsswitch.conf ENOENT,
  # then openat /usr/etc/nsswitch.conf = 3, and `getent passwd root` answers.
  # Do NOT add a grant for it: it is the same host subpath of the /usr bind, so
  # it is legal (sameUnderlyingTree) but an argv row with no effect and a claim
  # that is false on every non-openSUSE host.
  #
  # Not a silent downgrade of anything the sandbox can use. The fallback only
  # ever LOSES NSS modules — the host copy here names `mdns_minimal`, the
  # vendor copy names only `files dns` — and the sandbox has no socket for
  # sss, ldap, nis or mdns. With neither file glibc's compiled-in files/dns
  # default still resolves both databases (measured).
  "/etc/nsswitch.conf",
  "/etc/passwd",
  "/etc/group",

  # locale, timezone, and distro detection that tools branch on
  "/etc/localtime",
  "/etc/os-release",
  "/etc/alternatives",
]
optional = [
  "/opt",
  "/etc/ld.so.conf.d",
  "/etc/ssl",
  "/etc/pki",
  "/etc/ca-certificates",
  "/etc/ca-certificates.conf",
  "/etc/crypto-policies",
  "/var/lib/ca-certificates",
  "/usr/share/ca-certificates",
  "/etc/nsswitch.conf",
  "/etc/localtime",
  "/etc/os-release",
  "/etc/alternatives",
]
symlink = [
  { at = "/bin",   target = "usr/bin"   },
  { at = "/sbin",  target = "usr/sbin"  },
  { at = "/lib",   target = "usr/lib"   },
  { at = "/lib64", target = "usr/lib64" },
]

# There is deliberately NO `etc-full` builtin. A profile granting all of /etc is
# one line —
#
#   [profile.etc-full]
#   ro = ["/etc"]
#
# — that anyone can put in ~/.config/snug/profiles.d/. Shipping it bought nothing
# but a maintenance obligation and a thing to explain. snug ships the curated
# /etc above; whoever wants the whole tree writes that line and accepts what
# comes with it (every script in /etc/profile.d and /etc/bash.bashrc then RUNS
# inside the sandbox, so the distribution injects code into the agent's shell).
# Same minimalism as having no --read-only: the tool stays small, and the escape
# hatch is the profile format itself.

# ── an ephemeral, writable HOME ──────────────────────────────────────────────
# $HOME is the same absolute path as on the host, because tooling bakes absolute
# paths and the target usually lives under it. It is a tmpfs because persistence
# in $HOME is the primary escape-into-your-next-session vector: .bashrc,
# .profile, .config/autostart, .local/bin shadowing a command on your PATH.
#
# ABUSE: a hostile process inside the sandbox can write anything it likes into
# any of these directories. All of it dies with the sandbox — none of them is a
# host path — so what it buys an attacker is a place to stage files for the rest
# of THIS run, not a foothold in the next one.
#
# Each of these is bounded: snug passes bwrap `--size`, per mount, defaulting to
# policy.DefaultTmpfsSize and overridable by `tmpfs_size_mib` in
# ~/.config/snug/config.toml. The number lives in that constant and is
# deliberately not retyped here. Without the bound
# each one defaulted to HALF OF HOST RAM, so "a place to stage files" included
# staging enough of them to take the host down — a denial of service against
# the human running snug rather than against the sandbox (issue #281).
#
# {home}/.local/share is the fifth entry and the newest. It is here because
# XDG_DATA_HOME below names it, and a profile must grant every path it names
# (§2.5): without the tmpfs the variable would point at a directory that is not
# inside, and every tool honouring XDG would fail on a path snug itself wrote.
[profile.home]
description = "$HOME is an empty tmpfs at the host path. Writable, ephemeral."
tmpfs = [
  "{home}",
  "{home}/.cache",
  "{home}/.config",
  "{home}/.local/state",
  "{home}/.local/share",
]

# The XDG base directories, pointed at the tmpfs directories immediately above.
#
# ABUSE: a hostile process inside the sandbox can use these to make any tool that
# honours XDG write its state into the ephemeral tmpfs — which is exactly the
# point. Nothing here reaches a host path, each value names a directory this same
# profile creates, and a variable grants nothing on its own: it only tells a tool
# where to look.
#
# For two of these, WHERE TO LOOK INCLUDES A FILE THE TOOL WILL EXECUTE FROM, and
# that is the half "only tells a tool where to look" reads past. Measured on this
# host, both against directories that are the writable tmpfs above (issue #84):
#
#   XDG_CONFIG_HOME  git reads a COMMAND TABLE from $XDG_CONFIG_HOME/git/config —
#                    aliases, core.sshCommand, core.pager. git 2.55.0, and it
#                    fires WITH ~/.gitconfig present. It does NOT fire when
#                    GIT_CONFIG_GLOBAL is set, so the live case is a run where
#                    snug generates no gitconfig — i.e. the DEFAULT selection.
#                    Anyone re-measuring must `env -u GIT_CONFIG_GLOBAL`, or the
#                    measurement returns a false negative (it did once, because
#                    the measuring session was itself under snug).
#   XDG_DATA_HOME    bash-completion sources a file from it. 2.12.0,
#                    /usr/share/bash-completion/bash_completion:3235.
#
# XDG_CACHE_HOME and XDG_STATE_HOME reach nothing measured either way.
#
# This does NOT widen what the payload can do — it already runs code, and a
# writable $HOME reaches the same hijack through ~/.bashrc regardless. What it
# makes concrete is the tmpfs abuse sentence above: "a place to stage files for
# the rest of THIS run" includes staging a file another process in the same
# sandbox will EXECUTE, not merely read.
#
# It is recorded here rather than as a --dry-run annotation on the variable, on
# purpose. The hazard belongs to the TMPFS grant, which the FILESYSTEM block
# already renders `rw`; an XDG base directory must be writable, so a mark on the
# variable would fire on every default run and name no action the reader could
# take. See issue #84 for the full argument.
#
# They are `set` and not `inherit` deliberately. The host's XDG_CONFIG_HOME names
# a real directory full of real credentials, and admitting it past --clearenv
# would point every tool in the sandbox at a path the sandbox does not have —
# which is the good case. The bad one is a host that has moved XDG_CONFIG_HOME
# somewhere @home does not cover, where the tool would silently fall back to
# writing wherever that says.
[profile.home.environ.set]
XDG_CONFIG_HOME = "{home}/.config"
XDG_CACHE_HOME = "{home}/.cache"
XDG_STATE_HOME = "{home}/.local/state"
XDG_DATA_HOME = "{home}/.local/share"

# ── the project ──────────────────────────────────────────────────────────────
# ABUSE: the sandbox can rewrite anything in the target directory. That is the
# point, and it is why you review diffs. Nothing else persists.
[profile.cwd-rw]
description = "The target directory is writable and persists."
include = ["home"]
rw = ["{target}"]

# ABUSE: a hostile process inside the sandbox can read every file under the
# target's parent — every sibling project, their .git/config, their .env files,
# any credential anyone left in one, and any SOCKET sitting in the tree.
#
# WHAT THAT MEANS DEPENDS ON WHERE THE TARGET SITS, and that is the sentence to
# read twice, because it is the only abuse sentence in this file whose blast
# radius is not fixed by the grant. For ~/src/proj the parent is ~/src. For a
# project directly in your home directory the parent IS $HOME — every key, every
# dotfile, every agent socket. snug refuses that outright (issue #220): Validate
# rejects any bind covering $HOME, so this profile cannot be used to reach it.
# The refusal is doing real work rather than being fussy — it was measured
# handing over 14 private keys, .netrc, .aws, an EXECUTED ~/.gitconfig alias, an
# EXECUTED ~/.bashrc, and a signature from the host's ssh-agent.
#
# The target's parent is readable. Everything under higher ancestors stays
# invisible — not hidden, never granted. This is one line because the model has
# no hiding operation to get wrong.
[profile.parent-ro]
description = "The target's parent directory is readable."
ro = ["{target_parent}"]

# ── a /tmp the host can also see ─────────────────────────────────────────────
# ABUSE: anything the sandbox writes here is visible to the host, and to any
# other snug run on the same project. That is the point — it is how you hand a
# file to a host tool — but it means /tmp is no longer a dead end for data
# leaving the sandbox. Do not select it and then treat /tmp as private.
#
# The directory is per-project (named from a hash of the target) so a build
# cache stays warm across runs and two projects never share one. snug refuses to
# use it if it is a symlink, is owned by someone else, or is group/world
# accessible — the classic /tmp races.
[profile.tmp-shared]
description = "A per-project host directory becomes the sandbox's /tmp. Survives the sandbox."
rw = ["{host_tmpdir}:/tmp"]

# ── git identity, generated ──────────────────────────────────────────────────
# ABUSE: the sandbox learns the name and email you commit under, and nothing
# else from your git config. It is a name and an address, both of which are in
# every commit you have ever pushed.
#
# THIS PROFILE USED TO BIND ~/.gitconfig READ-ONLY, AND THAT WAS THE WRONG SHAPE.
# The file is not a data file with a name and an email in it — it is a COMMAND
# TABLE. credential.helper, alias.x = !cmd, core.pager, core.sshCommand,
# diff.*.textconv, filter.*.clean/smudge and core.fsmonitor all name programs for
# git to run, and binding the file read-only does not stop any of them: it
# SUPPLIES them. The old abuse sentence here called the hazard "secrets you
# unwisely put in ~/.gitconfig", which reads as a user error and understates a
# file whose keys are executable by design.
#
# So snug reads it as DATA and generates the config the sandbox sees, keeping
# only keys that carry no execution: user.name, user.email, init.defaultBranch.
# `includeIf "gitdir:"` is honoured — snug evaluates the condition itself against
# the target — so a per-directory identity keeps working. `includeIf
# "hasconfig:"` is refused and named on stderr, because that condition is decided
# by the REPOSITORY's own config: measured, a repo whose only property was a
# crafted remote URL pulled in a host file carrying credential.helper = !command.
#
# Not in `defaults`: it reads a host file, and reading a host file is a thing a
# human should ask for. Combine with an [identity] block and the block wins —
# a pin that a host value could override would not be a pin.
#
# The generated file bounds what the HOST's config can say inside the sandbox.
# It does not bound what the SANDBOX can say: GIT_CONFIG_COUNT/GIT_CONFIG_KEY_0
# enter git above every file (measured — issue #26), so a process in here can
# give itself core.sshCommand whatever this file holds. That costs an attacker
# nothing it did not already have — it already runs code and already holds
# SSH_AUTH_SOCK — but do not read the generated file as a restraint on the
# sandbox. See .claude/design/GIT-CONFIG.md §9.
[profile.git-ro]
description = "Your git name and email, extracted from the host config. Generated, never bound."
git = "extract"

# ── networking ───────────────────────────────────────────────────────────────
# ABUSE: the sandbox can reach the whole internet — exfiltrate anything it can
# read, fetch and run anything it likes. What it CANNOT reach is the host's
# 127.0.0.1, and it cannot reach abstract AF_UNIX sockets (X11, D-Bus) because
# those are scoped by the network namespace. Those two closures are the point.
#
# There is deliberately no "offline" profile. Offline is the ABSENCE of this
# one, which is why it cannot be switched back on by adding something.
[profile.net]
description = "Internet access via a private network namespace. Host loopback unreachable."
network = "egress"
dns = true

# ── publishing a port back to the host ───────────────────────────────────────
# ABUSE: the named port on the host's 127.0.0.1 reaches whatever the sandbox has
# listening there — so anything you publish, a hostile process inside can answer.
# The forward is bound to 127.0.0.1 only, never the LAN.
#
# There is no builtin for this, and no "publish whatever the sandbox binds".
# Write the ports you mean, in your own profile:
#
#   [profile.myports]
#   include = ["@net"]
#   publish = [3000, 8080]
#
# Two reasons it is a human naming ports rather than a switch.
#
# The design reason (INDEX §4.6): with `auto` the SANDBOX chooses what appears
# on your loopback, which inverts the guiding principle — a prompt-injected agent
# could squat 127.0.0.1:8080 ahead of your own dev server and intercept your
# browser.
#
# The empirical one: a `net-publish` profile shipped here with publish_auto, and
# it NEVER WORKED. pasta's `-t 127.0.0.1/auto` scans the namespace for bound
# ports once, when pasta starts — which is before the payload exists, so there is
# nothing to find and nothing is ever forwarded. Measured at 3, 10, 20 and 30
# seconds after a listener came up inside: connection refused every time, while
# --dry-run said "EVERY port the sandbox binds". A claim snug does not deliver is
# invariant 5's territory, and the honest fix for a capability that cannot work
# is to stop offering it.

# The sandbox does not learn your LAN address. pasta copies the host's addresses
# into the namespace by default, which is a small information disclosure.
#
# Setting an address also switches DNS onto pasta's interception path, and that
# is not a second feature — it is the same one. This profile used to hide the
# host's address and then name the host's LAN resolver in the sandbox's
# /etc/resolv.conf, which gives the hidden network straight back: a LAN resolver
# is normally the router, so 192.168.1.1 discloses the /24 the host sits in, and
# an IPv6 ULA resolver discloses a randomly-generated, stable per-site prefix.
# The search domain was anonymised here from the beginning and the nameserver
# was not — one rule applied to one of its two halves (issue #162). The sandbox
# is now told `nameserver 169.254.1.1`, an address that does not exist, and
# pasta re-issues the query from the host side.
#
# ABUSE: unchanged from @net — the whole internet, in and out. What this profile
# adds is a WITHHOLDING, not a hole. What it still does not hide: the sandbox
# has full egress, so a payload that wants to know where it is can ask any
# server it can reach, and DNS answers still tell it what the host's resolver
# would have told it. This bounds passive disclosure, not an active question.
#
# ABUSE (dns): a hostile process inside drives the HOST's resolver with
# arbitrary queries — any name, any type, UDP and TCP — from the host's network
# position. On a host with a routable resolver that is no new reach: it could
# query 192.168.1.1 directly over the egress @net already grants. On a
# systemd-resolved host it IS new reach, and this is the sentence to carry:
# 127.0.0.53 is a resolver process the sandbox can reach no other way, and it
# holds a cache of what the host user has been resolving plus any split-DNS
# domains a VPN put on that link — so `search .` withholds the internal domain
# NAMES while this resolves them anyway.
#
# What it does NOT get at that address, measured inside a live sandbox rather
# than reasoned about: 169.254.1.1 answers on port 53 over UDP and TCP and
# refuses 631, 853 and 3100; 169.254.1.2:53 is refused, so the forwarder
# answers on exactly one address. That measurement is what earns the phrase
# "not a hole" above; without it the phrase is an assertion.
#
# BOTH FAMILIES, and the v6 half is the one that mattered. `address` alone was a
# single IPv4 value, so pasta's IPv6 default -- copy the addresses from the
# interface holding the default route -- still applied, and the sandbox kept the
# host's own GLOBAL v6 addresses verbatim, the privacy-extension temporary one
# included, plus a v6 default route through the router's link-local address,
# which carries the router's MAC. The withheld half was RFC1918 and says almost
# nothing; the disclosed half is globally routable, geolocatable and
# ISP-attributable (issue #165). MEASURED closed: snug0 now carries only
# 10.13.13.2/24, fd00:5e79:1::2/64 and a link-local whose EUI-64 comes from a
# per-run random tap MAC, never the host's NIC.
#
# ABUSE: a hostile process inside can reach any service the HOST has bound on
# its own address -- including one bound to 0.0.0.0 or :: -- and the host's
# listener sees the connection as coming from the host itself, so an ACL that
# trusts "local" is satisfied. That is not new with the v6 pair and it is not a
# consequence of anonymising v6 in particular: it is what anonymising ANY family
# does, because the host's address stops being the sandbox's own address and the
# packet therefore leaves the netns instead of being refused by the sandbox's own
# stack. MEASURED, with plain @net as the control: under @net a listener on the
# host's LAN address and on 0.0.0.0 is refused from inside; under @net-anon the
# v4 ones are REACHED; with the v6 pair the v6 ones are too. HOST LOOPBACK STAYS
# CLOSED in all three -- 127.0.0.1 and ::1 are refused every time, and that is
# the property this project promises. Bind your host services to loopback.
# (issues #165, #176.)
#
# ABUSE (dns): unchanged in kind. Where the host's only resolver is IPv6, the
# forwarder is fd00:5e79:1::53 rather than 169.254.1.1 -- same interception, same
# sentence, one family over.
[profile.net-anon]
description = "As net, but the sandbox gets a synthetic address in BOTH families instead of the host's."
include = ["net"]
address  = "10.13.13.2/24"
gateway  = "10.13.13.1"
address6 = "fd00:5e79:1::2/64"
gateway6 = "fd00:5e79:1::1"

# ABUSE: EVERYTHING. The host's loopback (every service you run locally), every
# abstract AF_UNIX socket including X11 — which means keylogging and screenshots
# of your whole desktop — and the LAN with the host's identity. This is not a
# sandbox with networking; it is a process with a different filesystem view.
# Exists so "I need to debug a host service" does not become "so I stopped using
# snug". Requires --i-know.
[profile.net-host]
description = "DANGEROUS. Shares the HOST network namespace. Requires --i-know."
network = "host"
# DNS is named here so the sandbox is told the host's OWN resolvers, 127.0.0.53
# included. They are reachable because the netns IS the host's, and learning
# their addresses discloses strictly less than the namespace this profile has
# already handed over. Without this key the sandbox was told to use pasta's
# interception address while no pasta runs, so DNS simply did not work inside
# the one profile whose purpose is reaching host services (issue #164).
dns = true

# ── what a bare `snug <dir>` selects ─────────────────────────────────────────
# There is deliberately NO [profile.default] here. What a bare `snug <dir>`
# selects is a PREFERENCE, not a grant: it is the `defaults` setting in
# ~/.config/snug/config.toml, whose built-in value lives in
# internal/profile/defaults.go. A profile that grants nothing still showed up in
# SNUG_PROFILES, in `snug profile tree` and in every Mount's provenance as
# though it were a hole in the sandbox, and it duplicated an idea the config
# file already expressed. One idea, one mechanism.

# ── identity: one git/ssh/gh account, and nothing else ───────────────────────
# ABUSE: the sandbox gets a SIGNING ORACLE for one ssh key. It can push to any
# repository that key can reach, and authenticate to any host that trusts it.
# Pinning bounds WHICH identity, not WHAT is done with it — that is inherent to
# every agent forwarder, not a gap to be closed later. ~/.ssh is never mounted,
# so no key material enters the sandbox and the other keys in your agent cannot
# be enumerated or used.
#
# This profile is a TEMPLATE: copy it into ~/.config/snug/profiles.d/ and fill in
# your own account. It grants nothing on its own.
#
#   [profile.work]
#   include = ["net", "git-ro"]     # the `defaults` are selected as well; -p adds
#     [profile.work.identity]
#     gh_user   = "you"
#     git_name  = "Your Name"
#     git_email = "you@example.com"
#     ssh_key   = "{home}/.ssh/id_ed25519.pub"   # the PUBLIC half
#     ssh_mode  = "agent-proxy"
#
# TWO ACCOUNTS ARE TWO PROFILES, and that needs no mechanism snug does not have.
# Write the block twice with different keys and different gh_user values; each
# sandbox then acts as one account through BOTH channels — gh and git-over-ssh —
# and cannot act as the other. Selecting both at once is a hard error naming
# them, because an identity is a pin and two pins are a contradiction rather
# than a union. VERIFY.md §13 is the by-hand check, negatives included.
#
# The gh binary must be INSIDE for the staged token to be usable, and it is not
# always under /usr — a tarball in ~/bin is common, and then @sys does not carry
# it. One read-only bind into the directory snug stages commands in:
#
#   [profile.gh-cli]
#   ro = ["{home}/bin/gh_X.Y.Z_linux_amd64/bin/gh:/snug/bin/gh"]
#
# Not a builtin, deliberately: the path is host-specific, and a profile that
# guesses wrong would fail at a different layer than the one the human wrote.

# ── Claude Code ──────────────────────────────────────────────────────────────
# ABUSE: the sandbox can spend your Anthropic credits and read your Claude
# settings and personal skills. It CANNOT read your host session history, your
# MCP server configuration, the list of projects on this machine, or any other
# project's transcripts. That last clause was written before it was true — the
# staged ~/.claude.json carried mcpServers and all seven host project paths
# until issue #19; grep for the property before you believe the sentence.
#
# Credentials are staged as a writable PROJECTION — ~/.claude/.credentials.json,
# and nothing else — so a token refreshed inside does not reach the host, and
# the file the sandbox gets is generated rather than copied.
#
# THE ACCESS TOKEN CROSSES; THE REFRESH TOKEN DOES NOT (issue #58). The
# difference is the blast radius of a credential stolen from inside: measured on
# one host, the access token had 5h 20m left and the refresh token 26 days, and
# a refresh token mints new access tokens for as long as it lives. So a stolen
# credential used to outlive the sandbox without any bound the sandbox could
# set. It now expires with the access token.
#
# The cost, stated here rather than left to a bug report: with @net and a host
# token close to expiry this is a HARD failure where the refresh used to recover
# quietly. snug says so on the host before the run and names the fix (run
# `claude` on the host, then start snug again). MEASURED (claude 2.1.232) that
# the projection is enough: a session authenticates and completes a turn with
# refreshToken absent.
#
# ~/.claude.json is NOT copied. It is GENERATED: at most three keys, no host
# bytes (internal/cli/claude.go, claudeStateJSON). Enough that Claude Code opens on
# the prompt instead of the theme picker, and nothing more. MEASURED: Claude Code
# connects and works with the host file absent; only .credentials.json is
# load-bearing. The comment that used to sit here said the opposite and carried
# that decision for a milestone (issue #19).
#
# THE TRUST DIALOG IS NOT SUPPRESSED, and this profile is where that matters
# most. snug writes projects.<target>.hasTrustDialogAccepted only when the HOST's
# ~/.claude.json already records that exact directory as trusted — it carries the
# human's own answer and never invents one. Written unconditionally (it was, for
# one commit) it removes Claude Code's "Quick safety check" for a fresh clone of
# an unfamiliar repository, and MEASURED A/B on a fixture whose only content is
# .claude/settings.json with a SessionStart hook: with the key, no dialog and the
# repo's hook FIRES at startup; without it, the dialog blocks and the hook does
# not run. `snug -p @claude <unfamiliar-repo> -- claude` is exactly the review
# workflow this profile exists for, and the sandbox holds the staged OAuth token.
#
# Costs, all real and all intended: MCP servers configured on the host are not
# configured here (a .mcp.json committed in the TARGET still is — it is in the
# project tree, not the host's config); tool approvals given in a host session
# are asked again inside; and a directory you have not trusted on the host is
# asked about once per run.
#
# ~/.claude/settings.json is GENERATED, never bound, because it is a COMMAND
# TABLE. hooks (shell commands on ~34 tool events), apiKeyHelper (a program
# whose stdout IS an API key), statusLine, mcpServers, the AWS/GCP/OTEL
# credential helpers and processWrapper all name programs; enabledPlugins and
# extraKnownMarketplaces select and fetch code; env sets variables for every
# session. A read-only bind stops the sandbox EDITING that file and supplies
# every one of them — the ~/.gitconfig argument, one tool over.
#
# ABUSE: a hostile process inside the sandbox can read this file and learn the
# handful of scalar display preferences copied from your host settings — the
# model alias, the theme, the editor mode and some booleans — and nothing else
# about your host; it can rewrite it, because it is a private copy on a tmpfs
# that dies with the session and never reaches the host. It cannot obtain a
# command, a credential, a path, an environment variable or a plugin source
# from it, because no key of that kind is copied.
#
# The exact list is policy.ClaudeSettingAllowlist, and this comment
# deliberately does NOT restate it as a count. It said "ten … and seven
# booleans" for one draft, which is a copy of state held in that slice —
# CLAUDE.md's "the writable surface is eight paths" bullet records what
# happens next: the list grows, the prose does not, and no test can fail. The
# injected ~/.claude/CLAUDE.md enumerates the real names at runtime rather
# than counting them (claudeAllowlistNames, internal/cli/claude.go).
#
# THE PLUGIN DOOR, closed by `plugins` below (issue #68). `ro` still binds
# {home}/.claude/plugins, but dropping `enabledPlugins` from settings.json was
# never enough on its own: `~/.claude/plugins/installed_plugins.json` records
# the installed set and their paths independently, sits inside that same
# read-only bind, and Claude Code auto-loads each installed plugin's own
# `hooks.json`. MEASURED on the development host: 1075 files under the bind, of
# which 9 hooks.json (each running bash/sh/python3) and 7 package.json scripts
# name a program — 16 command tables the bind hands over — while 0 carry a
# credential today. snug now REGENERATES installed_plugins.json from the
# `plugins` allowlist below (the ~/.gitconfig precedent: extract a whitelist,
# generate the file), so Claude Code loads only the plugins you named. The rest
# of the tree stays visible and inert. MEASURED (claude 2.1.238): a plugin hook
# fires only when the plugin is BOTH in installed_plugins.json AND enabled in
# settings.json — two gates, and snug closes both (this regeneration, plus the
# settings.json filter that drops enabledPlugins), so #68 is defence-in-depth.
# TestManifestGatesPluginHookFiring drives the real binary and asserts an
# unnamed plugin's hook does not fire. See
# https://github.com/gomoni/snug/issues/68.
#
# THE PROJECT-SETTINGS DOOR, both directions, closed where the file exists
# (issue #73). The TARGET's own .claude/settings.json and settings.local.json
# are command tables Claude Code reads — and MEASURED, a SessionStart hook in
# one fired from a later host-side `claude -p` with NO trust dialog, NO
# approval, and NO entry recorded in ~/.claude.json, on a directory claude had
# never seen; an interactive `claude` on an already-trusted target fires it too.
# Two of the three realistic host scenarios have no gate at all. snug projects
# each file read-only through the SAME allowlist as the user-scope one, so a
# hostile repo's hooks do not run INSIDE and the payload's write does not survive
# OUTSIDE to run on your host later.
#
# RESIDUAL, stated because this check closes half its rule for a good reason: it
# projects ONLY where the file already exists, because a generated mount over an
# ABSENT path CREATES the file on the host (measured), which snug must not do. A
# clean repo where the payload CREATES a .claude/settings.json that did not
# exist before is NOT closed — that leaves a file you see in `git status`, which
# is not a guarantee and is not nothing. The half that closes is the sharper
# one: a hostile repo SHIPPING a settings.json with hooks is the exists case.
# See https://github.com/gomoni/snug/issues/73.
[profile.claude]
description = "Claude Code: binary and skills read-only, credentials projected and settings generated."
include = ["sys", "home"]
#
# The BINARY lands at /snug/bin/claude, not at its host path. snug stages
# every executable it puts in front of the payload in that one directory,
# because that directory is not writable from inside — see the note under `ro`
# below and CLAUDE.md's shadow-slot rule.
ro = [
  "{home}/.local/bin/claude:/snug/bin/claude",
  "{home}/.local/share/claude",
  "{home}/.claude/skills",
  "{home}/.claude/plugins",
]
optional = [
  "{home}/.local/bin/claude",
  "{home}/.local/share/claude",
  "{home}/.claude/skills",
  "{home}/.claude/plugins",
]

# The Claude Code plugins whose installed_plugins.json entry snug regenerates,
# so Claude Code auto-loads ONLY these — names, never paths (snug decides the
# path; issue #68). Empty here is the strict default: the generated manifest
# names nothing, so no plugin auto-loads even though the tree is still bound.
# A name may be bare ("caveman") or marketplace-qualified
# ("code-review@claude-plugins-official"); a named plugin that is not installed
# on the host is a hard error, not a silent omission.
#
# ABUSE: naming a plugin here hands the sandbox every command table that plugin
# ships — measured today as hooks.json running bash/sh/python3 and package.json
# scripts, 16 program-naming tables across the installed set, and the count
# grows with whatever the named plugins ship next. No credential is carried
# today, so the credential exposure is a bet on what the ecosystem writes into
# these files next rather than an observed problem; the program-naming reach is
# real now. Name only plugins you would run on the host unsandboxed.
plugins = []

# Host variables re-admitted past --clearenv, one name per line.
#
# ABUSE: a hostile process inside the sandbox can read every one of these out of
# /proc/self/environ, and so can every child it spawns. That is the whole cost of
# `inherit` and the reason the list is five names rather than a prefix: each is
# an endpoint or a preference, none is a credential.
#
# ANTHROPIC_API_KEY is deliberately NOT here, and must not come back.
#
# /proc/self/environ is passively readable by every process in the sandbox and
# is inherited by every child, so a variable is the worst place to put a
# long-lived credential — CLAUDE.md's rule is "put the secret in a file, not the
# environment". Claude Code also PREFERS the key over the OAuth token when both
# are present, so passing it made the sandbox use the more dangerous of the two
# credentials it had. Without it Claude authenticates from the staged, writable
# PROJECTION of ~/.claude/.credentials.json (internal/cli/claude.go), which is a
# file the payload has to open on purpose, which carries no refresh token
# (issue #58), and which never syncs back to the host at all.
#
# That last clause used to read "never syncs a modified token back without
# structural validation", describing a design that was never built — the same
# defect CLAUDE.md records about this file elsewhere. There is no sync-back
# channel. Do not write a sentence here that invites a reader to reason about a
# boundary that does not exist.
#
# ANTHROPIC_BASE_URL stays: it names an endpoint, not a credential, and users
# behind a gateway need it. If you need the key inside, that is a decision to
# make explicitly and per-run, not a line in a shipped profile.
[profile.claude.environ.inherit]
ANTHROPIC_BASE_URL = true
EDITOR = true
VISUAL = true
PAGER = true
NO_COLOR = true

# This profile deliberately has NO `environ.merge PATH`, and what replaced it is
# the point rather than a tidy-up.
#
# The binary still has to be findable — the default PATH is
# /usr/bin:/bin:/usr/sbin:/sbin, so `snug -p @claude . -- claude` once answered
# "execvp claude: No such file or directory" while the bind sat right there in
# --dry-run. The fix then was `merge PATH = ["{home}/.local/bin"]`, and it was
# WRONG in a way that took a review of §9.2 to see: {home} is a writable tmpfs,
# so that line put a directory the PAYLOAD CAN WRITE TO ahead of /usr/bin. The
# payload writes `git` into it and the next `git` a human or another agent runs
# inside the sandbox is that file. Nothing about the bind of `claude` was unsafe;
# the DIRECTORY it lived in was.
#
# Now the binary is bound at /snug/bin/claude and snug adds /snug/bin to
# PATH itself, in its own band, whenever anything is staged there — so no profile
# names a PATH directory at all and none can pick a writable one by accident.
# See policy.StagedBinDir and CLAUDE.md.
#
# ABUSE: a hostile process inside the sandbox can run whatever is in
# /snug/bin ahead of the distro's copy of the same name — and it cannot add
# to it, because that directory sits on the root tmpfs and --remount-ro / covers
# it (measured: `touch` and `echo >` both EROFS).

# There is deliberately NO `local-path` builtin granting all of ~/.local/bin.
# Same reasoning as `etc-full` above, and the same one-line escape hatch:
#
#   [profile.local-bin]
#   ro = ["{home}/.local/bin"]
#
#   [profile.local-bin.environ.merge]
#   PATH = ["{home}/.local/bin"]
#
# What it costs is why snug does not ship it. ~/.local/bin is wherever pipx, uv,
# cargo-install and your own scripts land — a mixed, personal, host-managed set.
# Granting the directory tells the sandbox what tools you have and lets it run
# all of them, when what you wanted was one. That is the "X but not Y" smell from
# CLAUDE.md pointing at too coarse a grant: if you want a tool in the sandbox,
# name that tool, the way this profile names `claude`.
#
# Read the second cost off the two lines above as well, because it is the one
# @claude got wrong for a milestone. That `ro` grant covers the DIRECTORY, so
# {home}/.local/bin is a real read-only bind and the `merge` is safe — a payload
# cannot write into it. Drop the `ro` line and keep the `merge`, and the same two
# lines put a writable tmpfs directory ahead of /usr/bin instead. The verb that
# made it safe is the grant, not the merge.

# ── containers ───────────────────────────────────────────────────────────────
# ABUSE: the sandbox can run arbitrary code in a container that shares the
# sandbox's OWN network namespace — so it reaches exactly what the sandbox
# reaches and no more: with @net, the whole internet, as the sandbox already
# could; WITHOUT @net, nothing. It cannot reconfigure that namespace (the
# engine holds no CAP_NET_ADMIN) and it cannot publish a port — `podman run -p
# N:80` is NOT supported, a decline rather than a regression: the engine
# shares the sandbox's netns host-mode, with no per-container bridge to
# publish onto. It can bind into a container only a path the sandbox can
# already see — enforced by the proxy's bind filter, which reads this same
# resolved policy (Tier B; Tier C makes it structural via a derived mount
# view instead of a private copy of the host tree).
#
# ABUSE (post-#284 fix): a hostile process inside the sandbox can use
# @podman-socket to bind, into a container, any path this sandbox can already
# see whose every path component it cannot rewrite — so a container's mounts
# are a subset of the sandbox's, and a name the payload owns can no longer be
# re-pointed at snug's own engine store, socket or toolchain between create and
# start (the anchored source rule, policy.CheckEngineBindSource).
#
# THE RULE, stated because the OUTCOME alone is not predictable. A source is
# forwarded only if EVERY component from it up to / is ANCHORED. A name whose
# parent this sandbox can write is re-pointable and is refused; a MOUNT ROOT is
# not re-pointable (renaming one from inside is EBUSY — measured, M1) and
# anchors the walk.
#
# ERGONOMIC COST, and it is LARGE — measured, not estimated. Two consequences
# fall out of that one rule:
#
#   NOTHING INSIDE THE TARGET IS EVER ACCEPTED, at any depth. The target is a
#   read-write bind, so every name in it has a writable parent. `-v
#   $SNUG_TARGET/build:/out` and `-v ./data:/data` are refused on every layout.
#
#   THE TARGET ROOT is accepted exactly while @parent-ro's own bind sits
#   DIRECTLY inside a mount root. Measured with defaults + @podman-socket:
#   accepted at ~/proj/sub and ~/src/proj (two levels below $HOME) and at
#   $TMPDIR/<dir>/proj; REFUSED at ~/src/projects/foo and deeper, where the
#   intermediate directory is a plain renameable name in the home tmpfs.
#   Measured directly: with the target at $HOME/x/y/proj/sub the payload ran
#   `mv "$HOME/x" other` successfully, carrying BOTH mounts with it.
#
# Always anchored, and therefore always still mountable: a read-only bind of
# /usr (201 against a real engine), and $HOME itself.
#
# So, plainly: `-v` works for paths OUTSIDE the sandbox's writable trees and
# for the target ROOT at shallow depth, and NEVER for anything inside the
# target. Where the root is accepted, bind it and address the subdirectory
# inside the container; at three levels and deeper there is no workaround, and
# the refusal message does not pretend there is.
#
# That is a refusal, never a silent narrowing: nothing is mounted with less
# than what was asked for, and no container gains reach the sandbox lacks.
# Widening it back needs a source path snug OWNS in the engine's view — a
# per-bind graft under /snug/engine, so the engine is handed a MOUNT rather
# than a re-resolvable string. Issue #376, a design decision and not a tweak
# to this rule.
#
# The engine runs in the SANDBOX's netns now (issue #63, Tier B), so
# `@podman-socket` without `@net` is genuinely offline, containers included.
# That is why `net` is NO LONGER included below: offline is once again the
# ABSENCE of a profile, which is what stops it being switched on by accident.
# Selecting a container engine starts a stage (a privileged-ancestor U) and
# delegates the full subuid range even offline — a real cost that
# `--dry-run`'s TOPOLOGY block states plainly.
#
# ABUSE (post-#386 fix): a hostile process inside the sandbox can still
# ENUMERATE every container the engine's store holds — the store is keyed on the
# target directory and PERSISTS, so `GET /containers/json?all=1` lists the names,
# images, commands, labels and mount tables an EARLIER run of this project left
# behind — and it can run an image an earlier run built. What it can no longer
# do is ACT on another run's container: every request addressed to one container
# is refused unless this run created it, and it is forwarded addressed by the
# container's immutable 64-hex id, so a rename cannot re-point the object
# between the check and the forward.
#
# The gate covered `DELETE` and nothing else for a milestone. Measured on podman
# 5.8.4, two runs on one target: run B answered 204 to
# `POST /containers/<A's container>/start`, then execed in as uid=0 and read a
# secret out of run A's container. Read that as the base rate for a rule applied
# to one of its verbs: the reasoning for gating `rm` was already the reasoning
# for gating `start`, and nobody re-read it.
#
# The image cache stays SHARED across runs on purpose — it is what makes a warm
# start warm — so an image an earlier run built is code a later run may execute.
# CONTAINERS are run-scoped; IMAGES are the project's.
[profile.podman-socket]
description = "Containers via a filtering proxy over a per-sandbox podman engine, offline unless @net is also selected."
include = ["sys", "home"]
podman = "socket"
# podman reads its registries, signature policy and defaults from here. Without
# it the client fails with an error that names none of that.
ro = ["/etc/containers"]
optional = ["/etc/containers"]

# ── building images ──────────────────────────────────────────────────────────
# ABUSE: the sandbox can build an image from a Dockerfile it wrote, which means
# running arbitrary commands in a container — but that is already true of
# `@podman-socket`, so this adds no new execution. What it adds is a SECOND SET
# OF OPTIONS to get wrong: a build can ask for host binds (`-v`), a host path as
# a named context (`--build-context x=/etc`), host devices, host networking and
# a chosen seccomp profile, none of it through HostConfig. Every one of those is
# judged, `-v` and `--build-context` by the same visibility rule as any other
# mount, and anything snug has not been taught about is refused by name.
#
# Separate from `@podman-socket` for exactly that reason: someone who only wants
# to RUN containers should not carry the build surface as well.
[profile.podman-build]
description = "As podman-socket, plus `podman build` with a filtered option set."
include = ["podman-socket"]
podman = "build"
